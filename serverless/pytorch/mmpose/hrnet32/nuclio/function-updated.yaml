spec:
  description: Whole Body points (Updated)
  runtime: 'python:3.11'
  handler: main:handler
  eventTimeout: 60s

  build:
    image: cvat.pth.mmpose.hrnet32.updated
    baseImage: python:3.11-slim

    directives:
      preCopy:
        - kind: RUN
          value: apt-get update && apt-get install -y git libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 wget --no-install-recommends && rm -rf /var/lib/apt/lists/*
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: pip install --upgrade pip setuptools wheel
        - kind: RUN
          value: pip install torch==2.1.0+cpu torchvision==0.16.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu
        - kind: RUN
          value: pip install openmim
        - kind: RUN
          value: mim install mmcv==2.1.0 mmdet==3.3.0 mmpose==1.3.0
        - kind: RUN
          value: git clone -b v1.3.0 --depth=1 https://github.com/open-mmlab/mmpose.git
        - kind: RUN
          value: wget -O td-hm_hrnet-w32_8xb64-210e_ubody-coco-256x192-7c227391_20230807.pth https://download.openmmlab.com/mmpose/v1/wholebody_2d_keypoint/ubody/td-hm_hrnet-w32_8xb64-210e_ubody-coco-256x192-7c227391_20230807.pth
        - kind: RUN
          value: wget -O rtmdet_nano_8xb32-100e_coco-obj365-person-05d8511e.pth https://download.openmmlab.com/mmpose/v1/projects/rtmpose/rtmdet_nano_8xb32-100e_coco-obj365-person-05d8511e.pth

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 20000
      attributes:
        maxRequestBodySize: 67108864 # 64MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
