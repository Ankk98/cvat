metadata:
  name: pth-dschoerk-transt-rocm
  namespace: cvat
  annotations:
    name: TransT (ROCm)
    type: tracker
    spec: ""

spec:
  description: Fast Online Object Tracking and Segmentation (ROCm build)
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/trans-t

  build:
    image: cvat.pth.dschoerk.transt:latest-rocm
    baseImage: docker.io/rocm/pytorch:rocm7.1_ubuntu22.04_py3.10_pytorch_release_2.6.0

    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: RUN
          value: apt-get update && apt-get install -y --no-install-recommends git ca-certificates python3 python3-pip python-is-python3 && rm -rf /var/lib/apt/lists/*
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: git clone --depth 1 --branch v1.0 https://github.com/dschoerk/TransT trans-t
        - kind: RUN
          value: pip3 install --upgrade pip
        - kind: RUN
          value: pip3 install jsonpickle opencv-python-headless
        - kind: ADD
          value: https://drive.google.com/uc?id=1Pq0sK-9jmbLAVtgB9-dPDc2pipCxYdM5 /transt.pth

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 268435456 # 256MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume

