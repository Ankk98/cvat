metadata:
  name: pth-facebookresearch-sam-auto-rocm
  namespace: cvat
  annotations:
    name: SAM Auto Segmentation (ROCm)
    type: detector
    framework: pytorch
    description: Automatic object segmentation using Segment Anything Model
    spec: |
      [
        {
          "name": "object",
          "type": "mask",
          "attributes": [
            {"name": "confidence", "input_type": "number", "values": [0, 1]},
            {"name": "area", "input_type": "number", "values": []}
          ]
        }
      ]

spec:
  description: Automatic object segmentation with Segment Anything Model
  runtime: 'python:3.10'
  handler: main_detector:handler
  eventTimeout: 300s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam

  build:
    image: cvat.pth.facebookresearch.sam.auto.rocm:latest-rocm
    baseImage: docker.io/rocm/pytorch:rocm7.1_ubuntu22.04_py3.10_pytorch_release_2.6.0

    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: WORKDIR
          value: /opt/nuclio/sam
        - kind: RUN
          value: apt-get update && apt-get install -y git python3 python3-pip ffmpeg libsm6 libxext6 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip3 install --upgrade pip
        - kind: RUN
          value: pip3 install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --extra-index-url https://download.pytorch.org/whl/rocm7.1
        - kind: RUN
          value: pip3 install opencv-python-headless
        - kind: RUN
          value: pip3 install git+https://github.com/facebookresearch/segment-anything.git
        - kind: RUN
          value: curl -O https://dl.fbaipublicfiles.com/segment_anything/sam_vit_h_4b8939.pth

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 300000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
