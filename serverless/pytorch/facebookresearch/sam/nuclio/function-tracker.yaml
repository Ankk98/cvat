metadata:
  name: pth-facebookresearch-sam-vit-h-rocm-tracker
  namespace: cvat
  annotations:
    name: Segment Anything Tracker (ROCm)
    version: "2"
    type: tracker
    framework: pytorch
    description: Track masks and polygons across video frames using Segment Anything Model
    spec: |
      [
        {
          "name": "person",
          "type": "any",
          "attributes": []
        }
      ]
    supported_shape_types: "mask,polygon"

spec:
  description: Track masks and polygons across video frames using Segment Anything Model on ROCm GPUs
  runtime: 'python:3.10'
  handler: main_tracker:handler
  eventTimeout: 60s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam

  build:
    image: cvat.pth.facebookresearch.sam.vit_h.tracker:latest-rocm
    baseImage: docker.io/rocm/pytorch:rocm7.1_ubuntu22.04_py3.10_pytorch_release_2.6.0

    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: WORKDIR
          value: /opt/nuclio/sam
        - kind: RUN
          value: apt-get update && apt-get install -y git python3 python3-pip ffmpeg libsm6 libxext6 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip3 install opencv-python-headless
        - kind: RUN
          value: pip3 install --upgrade pip
        - kind: RUN
          value: pip3 install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --extra-index-url https://download.pytorch.org/whl/rocm7.1
        - kind: RUN
          value: pip3 install git+https://github.com/facebookresearch/segment-anything.git
        - kind: RUN
          value: pip3 install cvat-sdk || echo "cvat-sdk installation failed, will use fallback mask encoding"
        - kind: RUN
          value: curl -O https://dl.fbaipublicfiles.com/segment_anything/sam_vit_h_4b8939.pth

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  resources:
    limits:
      amd.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume

