spec:
  description: Mask R-CNN R50 Tracker from Detectron2 optimized for ROCm GPUs - Instance Segmentation Tracking
  runtime: python:3.10
  handler: main_tracker:handler
  eventTimeout: 60s
  build:
    image: cvat.pth.facebookresearch.detectron2.mask_rcnn_r50_rocm.tracker:latest-rocm
    baseImage: docker.io/rocm/pytorch:rocm7.1_ubuntu22.04_py3.10_pytorch_release_2.6.0
    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: RUN
          value: apt-get update && apt-get -y install curl git python3 python3-pip &&
            rm -rf /var/lib/apt/lists/*
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: pip3 install --upgrade pip
        - kind: RUN
          value: pip3 install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --extra-index-url
            https://download.pytorch.org/whl/rocm7.1
        - kind: RUN
          value: pip3 install --no-build-isolation 'git+https://github.com/facebookresearch/detectron2@ff53992b1985'
        - kind: RUN
          value: pip3 install opencv-python-headless
  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: http
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432
  resources:
    limits:
      amd.com/gpu: 1
  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume