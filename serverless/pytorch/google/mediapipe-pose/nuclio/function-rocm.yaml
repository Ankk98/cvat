spec:
  description: MediaPipe Pose Estimation with 33 keypoints (ROCm optimized)
  runtime: 'python:3.9'
  handler: main:handler
  eventTimeout: 15s

  build:
    image: cvat.pth.google.mediapipe.pose.rocm
    baseImage: docker.io/rocm/pytorch:rocm7.1_ubuntu22.04_py3.10_pytorch_release_2.6.0

    directives:
      preCopy:
        - kind: RUN
          value: apt-get update && apt-get install -y libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 ffmpeg --no-install-recommends && rm -rf /var/lib/apt/lists/*
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: pip install --upgrade pip setuptools wheel
        - kind: RUN
          value: pip install mediapipe==0.10.9 opencv-python-headless==4.8.1.78 numpy==1.24.3 pillow==10.0.1

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
