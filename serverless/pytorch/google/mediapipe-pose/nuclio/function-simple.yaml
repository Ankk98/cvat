metadata:
  name: pth-google-mediapipe-pose-simple
  namespace: cvat
  annotations:
    name: MediaPipe Pose Simple
    type: detector
    spec: |
      [
        {
          "name": "pose",
          "type": "skeleton",
          "svg": "<circle r=\"1.5\" cx=\"50\" cy=\"15\" data-type=\"element node\" data-element-id=\"0\" data-node-id=\"0\" data-label-name=\"nose\"></circle><circle r=\"1.5\" cx=\"45\" cy=\"35\" data-type=\"element node\" data-element-id=\"11\" data-node-id=\"11\" data-label-name=\"left_shoulder\"></circle><circle r=\"1.5\" cx=\"55\" cy=\"35\" data-type=\"element node\" data-element-id=\"12\" data-node-id=\"12\" data-label-name=\"right_shoulder\"></circle><circle r=\"1.5\" cx=\"35\" cy=\"50\" data-type=\"element node\" data-element-id=\"13\" data-node-id=\"13\" data-label-name=\"left_elbow\"></circle><circle r=\"1.5\" cx=\"65\" cy=\"50\" data-type=\"element node\" data-element-id=\"14\" data-node-id=\"14\" data-label-name=\"right_elbow\"></circle><circle r=\"1.5\" cx=\"30\" cy=\"65\" data-type=\"element node\" data-element-id=\"15\" data-node-id=\"15\" data-label-name=\"left_wrist\"></circle><circle r=\"1.5\" cx=\"70\" cy=\"65\" data-type=\"element node\" data-element-id=\"16\" data-node-id=\"16\" data-label-name=\"right_wrist\"></circle><circle r=\"1.5\" cx=\"40\" cy=\"70\" data-type=\"element node\" data-element-id=\"23\" data-node-id=\"23\" data-label-name=\"left_hip\"></circle><circle r=\"1.5\" cx=\"60\" cy=\"70\" data-type=\"element node\" data-element-id=\"24\" data-node-id=\"24\" data-label-name=\"right_hip\"></circle><circle r=\"1.5\" cx=\"38\" cy=\"85\" data-type=\"element node\" data-element-id=\"25\" data-node-id=\"25\" data-label-name=\"left_knee\"></circle><circle r=\"1.5\" cx=\"62\" cy=\"85\" data-type=\"element node\" data-element-id=\"26\" data-node-id=\"26\" data-label-name=\"right_knee\"></circle>",
          "sublabels": [
            {"id": 0, "name": "nose", "type": "points"},
            {"id": 11, "name": "left_shoulder", "type": "points"},
            {"id": 12, "name": "right_shoulder", "type": "points"},
            {"id": 13, "name": "left_elbow", "type": "points"},
            {"id": 14, "name": "right_elbow", "type": "points"},
            {"id": 15, "name": "left_wrist", "type": "points"},
            {"id": 16, "name": "right_wrist", "type": "points"},
            {"id": 23, "name": "left_hip", "type": "points"},
            {"id": 24, "name": "right_hip", "type": "points"},
            {"id": 25, "name": "left_knee", "type": "points"},
            {"id": 26, "name": "right_knee", "type": "points"}
          ]
        }
      ]

spec:
  description: MediaPipe Pose (Simplified 11 keypoints)
  runtime: 'python:3.9'
  handler: main:handler
  eventTimeout: 10s

  build:
    image: cvat.pth.google.mediapipe.pose.simple
    baseImage: python:3.9-slim

    directives:
      preCopy:
        - kind: RUN
          value: apt-get update && apt-get install -y libgl1-mesa-glx libglib2.0-0 --no-install-recommends && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install mediapipe opencv-python-headless numpy pillow

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
