metadata:
  name: pth-mmdet3d-fcaf3d-rocm
  namespace: cvat
  annotations:
    # Display name in CVAT UI
    name: FCAF3D 3D Cuboids (ROCm)
    # Model version for tracking changes
    version: 1.0
    # Function type: detector (for automatic annotation)
    type: detector
    # Supported annotation shapes: cuboid (3D boxes)
    supported_shape_types: cuboid
    spec: |
      [
        { "id": 0, "name": "cabinet", "type": "cuboid" },
        { "id": 1, "name": "bed", "type": "cuboid" },
        { "id": 2, "name": "chair", "type": "cuboid" },
        { "id": 3, "name": "sofa", "type": "cuboid" },
        { "id": 4, "name": "table", "type": "cuboid" },
        { "id": 5, "name": "door", "type": "cuboid" },
        { "id": 6, "name": "window", "type": "cuboid" },
        { "id": 7, "name": "bookshelf", "type": "cuboid" },
        { "id": 8, "name": "picture", "type": "cuboid" },
        { "id": 9, "name": "counter", "type": "cuboid" },
        { "id": 10, "name": "desk", "type": "cuboid" },
        { "id": 11, "name": "curtain", "type": "cuboid" },
        { "id": 12, "name": "refrigerator", "type": "cuboid" },
        { "id": 13, "name": "showercurtain", "type": "cuboid" },
        { "id": 14, "name": "toilet", "type": "cuboid" },
        { "id": 15, "name": "sink", "type": "cuboid" },
        { "id": 16, "name": "bathtub", "type": "cuboid" },
        { "id": 17, "name": "otherfurniture", "type": "cuboid" }
      ]

spec:
  description: FCAF3D fully convolutional anchor-free 3D object detection for indoor scenes using MMDetection3D on ROCm GPUs. (Proxy implementation)
  runtime: 'python:3.9'
  handler: main-proxy:handler
  eventTimeout: 60s  # FCAF3D can be slower than heuristic methods
  env:
    - name: FCAF3D_SERVICE_URL
      value: "http://fcaf3d-service:8000"
    - name: FCAF3D_SERVICE_TIMEOUT
      value: '60'
  build:
    image: cvat.pth.mmdet3d.fcaf3d.proxy
    baseImage: python:3.9-slim
    directives:
      preCopy:
      - kind: WORKDIR
        value: /opt/nuclio
      - kind: RUN
        value: apt-get update && apt-get install -y curl --no-install-recommends && rm -rf /var/lib/apt/lists/*
      - kind: RUN
        value: pip install --upgrade pip
      - kind: RUN
        value: pip install requests
  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 67108864  # 64MB for large point clouds

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
