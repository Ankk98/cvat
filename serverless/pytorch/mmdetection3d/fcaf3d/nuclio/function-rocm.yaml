metadata:
  name: pth-mmdet3d-fcaf3d-rocm
  namespace: cvat
  annotations:
    # Display name in CVAT UI
    name: FCAF3D 3D Cuboids (ROCm)
    # Model version for tracking changes
    version: 1.0
    # Function type: detector (for automatic annotation)
    type: detector
    # Supported annotation shapes: cuboid (3D boxes)
    supported_shape_types: cuboid
    # Output labels: pedestrian detection
    spec: |
      [
        { "id": 0, "name": "Pedestrian", "type": "cuboid" }
      ]

spec:
  description: FCAF3D fully convolutional anchor-free 3D object detection for indoor scenes using MMDetection3D on ROCm GPUs. Optimized for pedestrian detection in social navigation datasets.
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 60s  # FCAF3D can be slower than heuristic methods
  env:
    - name: PYTHONPATH
      value: /mmdetection3d:/opt/venv/lib/python3.10/site-packages:/opt/fcaf3d
    - name: DEFAULT_CONFIDENCE_THRESHOLD
      value: "0.3"
    - name: FCAF3D_CONFIG
      value: "configs/fcaf3d/fcaf3d_1x8_scannet-3d-18class.py"
    - name: FCAF3D_CHECKPOINT
      value: "checkpoints/fcaf3d_scannet.pth"
    # MMDetection3D environment
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
    - name: TORCH_USE_CUDA_DSA
      value: "1"

  image: ankk98/cvat-fcaf3d-rocm:latest

  # Set working directory for proper path resolution
  workdir: /opt/fcaf3d

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 67108864  # 64MB for large point clouds

  # GPU resource requirements
  # FCAF3D benefits significantly from GPU acceleration
  resources:
    limits:
      amd.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
