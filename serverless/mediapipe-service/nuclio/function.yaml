    description: MediaPipe pose and hand detection optimized for egocentric videos
spec:
  description: Proxy function for MediaPipe pose + hands detection service (egocentric videos)
  runtime: python:3.9
  handler: main:handler
  eventTimeout: 60s
  env:
  - name: MEDIAPIPE_SERVICE_URL
    value: http://mediapipe-pose:8000
  - name: MEDIAPIPE_SERVICE_TIMEOUT
    value: '30'
  build:
    image: cvat.pth.google.mediapipe.pose.hands
    baseImage: python:3.9-slim
    directives:
      preCopy:
      - kind: WORKDIR
        value: /opt/nuclio
      - kind: RUN
        value: apt-get update && apt-get install -y curl --no-install-recommends && rm -rf /var/lib/apt/lists/*
      - kind: RUN
        value: pip install --upgrade pip
      - kind: RUN
        value: pip install requests
  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: http
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432
  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
